###############################################################################
# ThinkCode Full-Stack Template — Local Development Compose Override
#
# Usage:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml up -d
#   or via Makefile: `make up`
###############################################################################

services:
  nginx:
    ports:
      - "${FORWARD_HTTP_PORT:-8080}:80"

  backend:
    environment:
      APP_ENV: "local"
      APP_DEBUG: "true"
      RUN_MIGRATIONS: "true"
      GENERATE_APP_KEY: "true"

  postgres:
    ports:
      - "${FORWARD_DB_PORT:-5433}:5432"

  redis:
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
